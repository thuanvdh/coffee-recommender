name: coffee_recommender
description: "A new Flutter project for Danang Coffee Recommender."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Networking
  dio: ^5.4.0
  retrofit: 4.6.0
  json_annotation: ^4.9.0

  # Data Models
  freezed_annotation: ^2.4.0

  # Storage
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.2.0

  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # UI
  cached_network_image: ^3.3.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  flutter_lucide: ^1.11.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: any
  json_serializable: any
  retrofit_generator: ^9.6.0
  riverpod_generator: any
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
